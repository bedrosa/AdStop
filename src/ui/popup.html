<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdStop</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup">
  <header class="brand-row">
    <div class="brand"><img src="icons/48.png" alt="" width="32" height="32"><span>AdStop<span class="brand-dot">.</span></span></div>
    <span class="local-label">EN TU NAVEGADOR</span>
  </header>
  <main>
    <div class="site-label" id="hostname">Cargando...</div>
    <section class="protection">
      <button id="power" class="power" aria-label="Cambiar protección en esta web" disabled>
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 8v16M14 13a17 17 0 1 0 20 0"/></svg>
      </button>
      <h1 id="site-status">Preparando protección</h1>
      <p id="site-help">Listas abiertas. Control en tus manos.</p>
    </section>
    <section class="blocked-summary" aria-label="Bloqueos de esta página">
      <strong id="blocked-count" aria-live="polite">0</strong>
      <div><span>Anuncios y rastreadores</span><small>bloqueados en esta página</small></div>
    </section>
    <section class="blocked-details" aria-label="Dominios bloqueados">
      <p class="caption">Desde la última carga de la web</p>
      <ul id="blocked-list" class="blocked-list"></ul>
      <p id="blocked-empty" class="blocked-empty">Todavía no hay bloqueos registrados</p>
    </section>
    <label class="switch-row"><span>Protección general</span><input type="checkbox" id="enabled" role="switch" disabled></label>
    <p class="error" id="error" role="alert"></p>
  </main>
  <footer><button id="options" class="text-button">Ajustes <span aria-hidden="true">&#8594;</span></button></footer>
</body>
</html>
