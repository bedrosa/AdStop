<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdStop</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup">
  <header class="brand-row">
    <div class="brand"><img src="icons/logo.svg" alt="" width="36" height="36"><span>AdStop<span class="brand-dot">.</span></span></div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false" title="Activar modo oscuro">
      <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.3A9 9 0 0 1 10.7 3.1 9 9 0 1 0 20.9 13.3Z"/></svg>
      <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <main>
    <div class="site-label" id="hostname">Cargando...</div>
    <section class="protection">
      <button id="power" class="power" aria-label="Cambiar protección en esta web" disabled>
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 8v16M14 13a17 17 0 1 0 20 0"/></svg>
      </button>
      <h1 id="site-status">Preparando protección</h1>
      <p id="site-help">Listas abiertas. Control en tus manos.</p>
    </section>
    <section class="blocked-summary" aria-label="Bloqueos de esta página">
      <strong id="blocked-count" aria-live="polite">0</strong>
      <div><span>Anuncios y rastreadores</span><small>bloqueados en esta página</small></div>
    </section>
    <section class="blocked-details" aria-label="Dominios bloqueados">
      <p class="caption">Desde la última carga de la web</p>
      <ul id="blocked-list" class="blocked-list"></ul>
      <p id="blocked-empty" class="blocked-empty">Todavía no hay bloqueos registrados</p>
    </section>
    <div class="lifetime-summary"><span>Total anuncios bloqueados</span><strong id="total-count">0</strong></div>
    <p class="error" id="error" role="alert"></p>
    <button id="reload-extension" class="secondary reload-extension" hidden>Recargar AdStop</button>
  </main>
  <footer><button id="options" class="text-button">Ajustes <span aria-hidden="true">&#8594;</span></button></footer>
</body>
</html>
